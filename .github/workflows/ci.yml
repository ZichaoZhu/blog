name: Astro migration checks

on:
  push:
    branches: [feat/astro-firefly]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_MODE: preview
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.22.0'
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint:check
      - run: pnpm check
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm verify:site
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: git diff --check
